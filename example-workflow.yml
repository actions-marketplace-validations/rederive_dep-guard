# Drop this at .github/workflows/dep-guard.yml in any repo you want gated.
name: dep-guard
on:
  pull_request:
    paths: ['**/package-lock.json', '**/pnpm-lock.yaml', '**/package.json']
permissions:
  contents: read        # checkout + `git show` the base lockfile; annotations/summary need nothing more
jobs:
  dep-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # REQUIRED: the base ref must be present to diff the lockfile
      - uses: rederive/dep-guard@v1   # or pin an exact release: rederive/dep-guard@v1.0.0
        with:
          rederive-version: '0.5.3'   # the exact rdv the guard runs (npx --yes rederive@0.5.3)
          fail-closed: 'true'         # a guard crash / empty / invalid output fails the check (exit 2)
